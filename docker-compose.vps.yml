services:
  teacherreader-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teacherreader-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_ONLY: "true"
      PORT: "3000"
    ports:
      # Loopback only: Tailscale Funnel proxies to this port.
      - "127.0.0.1:3110:3000"
    # VPS compartilhada com o MemeTrigger: limita o impacto de um pico de TTS/STT.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    init: true
    security_opt:
      - no-new-privileges:true
    # A API não precisa de nenhuma capability: só abre a porta 3000 (>1024).
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/voice-hub/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
